<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>AlesDraw</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#111;

    font-family:Arial,sans-serif;

}


/* =========================================
   PÁGINA REAL
========================================= */

#page{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

}


/* =========================================
   PANEL DE CARGA
========================================= */

#loading{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #151a20 0%,
            #0c0e11 55%,
            #070809 100%
        );

    color:white;

    overflow:hidden;

    transition:
        opacity .9s ease,
        visibility .9s ease;

}


/* =========================================
   CANVAS DE AGUA
========================================= */

#waterCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:0;

    pointer-events:none;

}


/* =========================================
   CONTENIDO
========================================= */

.loadingContent{

    position:relative;

    z-index:2;

    display:flex;

    flex-direction:column;

    align-items:center;

    pointer-events:none;

}


/* =========================================
   LOGO
========================================= */

.logo{

    font-size:44px;

    font-weight:bold;

    letter-spacing:1px;

    margin-bottom:25px;

    text-shadow:
        0 0 20px rgba(88,101,242,.25);

}


.logo span{

    color:#5865f2;

}


/* =========================================
   CÍRCULO
========================================= */

.loader{

    width:58px;

    height:58px;

    border-radius:50%;

    border:5px solid rgba(255,255,255,.08);

    border-top-color:#5865f2;

    border-right-color:#7480ff;

    animation:
        spin 1s linear infinite;

    box-shadow:
        0 0 20px rgba(88,101,242,.15);

}


@keyframes spin{

    to{

        transform:rotate(360deg);

    }

}


/* =========================================
   TEXTO
========================================= */

#loadingText{

    margin-top:20px;

    color:#bbb;

    font-size:15px;

    text-shadow:
        0 1px 5px #000;

}


#progress{

    margin-top:8px;

    color:#666;

    font-size:13px;

}


/* =========================================
   INDICADOR INTERACTIVO
========================================= */

#hint{

    position:absolute;

    bottom:30px;

    z-index:2;

    color:#555;

    font-size:12px;

    opacity:.8;

    pointer-events:none;

}


/* =========================================
   DESAPARECER
========================================= */

#loading.hidden{

    opacity:0;

    visibility:hidden;

    pointer-events:none;

}

</style>

</head>


<body>


<!-- ========================================
     PÁGINA REAL
========================================= -->

<iframe
    id="page"
    src="https://remsisk.bonto.run/"
></iframe>


<!-- ========================================
     PANEL DE CARGA
========================================= -->

<div id="loading">


    <!-- Canvas de las ondas -->

    <canvas id="waterCanvas"></canvas>


    <!-- Contenido -->

    <div class="loadingContent">

        <div class="logo">

            Ales<span>Draw</span>

        </div>


        <div class="loader"></div>


        <div id="loadingText">

            Preparando el servidor...

        </div>


        <div id="progress">

            0%

        </div>

    </div>


    <div id="hint">

        Toca la pantalla para crear ondas

    </div>


</div>



<script>


/* =========================================
   CARGA
========================================= */

const MIN_TIME = 30000;

const MAX_TIME = 60000;


const loadTime =
    Math.floor(
        Math.random() *
        (MAX_TIME - MIN_TIME + 1)
    ) + MIN_TIME;


const loading =
    document.getElementById(
        "loading"
    );


const progress =
    document.getElementById(
        "progress"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


const start =
    Date.now();


/* =========================================
   PROGRESO
========================================= */

const progressTimer =
    setInterval(() => {


        const elapsed =
            Date.now() - start;


        let percent =
            Math.floor(
                (elapsed / loadTime) * 100
            );


        percent =
            Math.min(
                99,
                percent
            );


        progress.textContent =
            percent + "%";


        if(percent < 25){

            loadingText.textContent =
                "Preparando el servidor...";

        }
        else if(percent < 50){

            loadingText.textContent =
                "Conectando...";

        }
        else if(percent < 75){

            loadingText.textContent =
                "Cargando AlesDraw...";

        }
        else if(percent < 95){

            loadingText.textContent =
                "Sincronizando...";

        }
        else{

            loadingText.textContent =
                "Casi listo...";

        }


    },100);


/* =========================================
   FINAL
========================================= */

setTimeout(() => {


    clearInterval(
        progressTimer
    );


    progress.textContent =
        "100%";


    loadingText.textContent =
        "Listo";


    setTimeout(() => {


        loading.classList.add(
            "hidden"
        );


    },500);


},loadTime);



/* ==================================================
   SISTEMA DE ONDAS
================================================== */

const waterCanvas =
    document.getElementById(
        "waterCanvas"
    );


const waterCtx =
    waterCanvas.getContext(
        "2d"
    );


let ripples = [];


/* =========================================
   RESIZE
========================================= */

function resizeWater(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    waterCanvas.width =
        window.innerWidth * dpr;


    waterCanvas.height =
        window.innerHeight * dpr;


    waterCanvas.style.width =
        window.innerWidth + "px";


    waterCanvas.style.height =
        window.innerHeight + "px";


    waterCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


resizeWater();


window.addEventListener(
    "resize",
    resizeWater
);



/* ==================================================
   CREAR ONDA
================================================== */

function createRipple(x,y){


    /*
        Onda principal
    */

    ripples.push({

        x:x,

        y:y,

        radius:1,

        opacity:.7,

        speed:
            1.2 +
            Math.random() * .5,

        width:
            1.5 +
            Math.random() * 2,

        distortion:
            Math.random() * Math.PI * 2,

        wobble:
            .5 +
            Math.random() * .7

    });


    /*
        Segunda onda ligeramente retrasada
    */

    setTimeout(() => {


        ripples.push({

            x:x,

            y:y,

            radius:4,

            opacity:.35,

            speed:.9,

            width:1,

            distortion:
                Math.random() * Math.PI * 2,

            wobble:
                .4 +
                Math.random() * .5

        });


    },80);


    /*
        Pequeñas ondas secundarias
    */

    for(let i=0;i<3;i++){


        setTimeout(() => {


            const angle =
                Math.random() *
                Math.PI * 2;


            const distance =
                5 +
                Math.random() * 15;


            ripples.push({

                x:
                    x +
                    Math.cos(angle) *
                    distance,

                y:
                    y +
                    Math.sin(angle) *
                    distance,

                radius:1,

                opacity:.18,

                speed:.6 +

                    Math.random() *
                    .3,

                width:.7,

                distortion:
                    Math.random() *
                    Math.PI * 2,

                wobble:.3 +

                    Math.random() *
                    .3

            });


        },100 + i*80);

    }

}



/* ==================================================
   DIBUJAR ONDA
================================================== */

function drawRipple(ripple){

    const {

        x,
        y,
        radius,
        opacity,
        width,
        distortion,
        wobble

    } = ripple;


    /*
        Muchas pequeñas secciones
        para que el círculo no sea
        perfectamente geométrico.
    */

    const segments = 100;


    waterCtx.beginPath();


    for(
        let i=0;
        i<=segments;
        i++
    ){

        const angle =
            (i / segments) *
            Math.PI *
            2;


        /*
            Distorsión natural
        */

        const wave =
            Math.sin(
                angle * 5 +
                distortion
            ) *
            wobble;


        const wave2 =
            Math.sin(
                angle * 9 -
                distortion * 1.4
            ) *
            wobble *
            .35;


        const r =
            radius +
            wave +
            wave2;


        const px =
            x +
            Math.cos(angle) *
            r;


        const py =
            y +
            Math.sin(angle) *
            r;


        if(i === 0){

            waterCtx.moveTo(
                px,
                py
            );

        }
        else{

            waterCtx.lineTo(
                px,
                py
            );

        }

    }


    waterCtx.strokeStyle =
        `rgba(130,160,190,${opacity})`;


    waterCtx.lineWidth =
        width;


    waterCtx.stroke();

}



/* ==================================================
   ANIMACIÓN
================================================== */

function animateWater(){


    waterCtx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    for(
        let i=ripples.length-1;
        i>=0;
        i--
    ){


        const ripple =
            ripples[i];


        /*
            Expandir
        */

        ripple.radius +=
            ripple.speed;


        /*
            Desvanecer progresivamente
        */

        ripple.opacity *= .985;


        /*
            La onda pierde fuerza
        */

        ripple.wobble *= .998;


        drawRipple(
            ripple
        );


        /*
            Eliminar cuando
            ya desapareció
        */

        if(
            ripple.opacity < .01 ||
            ripple.radius > 500
        ){

            ripples.splice(
                i,
                1
            );

        }

    }


    requestAnimationFrame(
        animateWater
    );

}


animateWater();



/* ==================================================
   TOQUES
================================================== */

function waterTouch(e){

    /*
        Solo funciona mientras
        el panel está visible.
    */

    if(
        loading.classList.contains(
            "hidden"
        )
    )
        return;


    let x;
    let y;


    if(
        e.touches &&
        e.touches.length
    ){

        x =
            e.touches[0].clientX;

        y =
            e.touches[0].clientY;

    }
    else{

        x =
            e.clientX;

        y =
            e.clientY;

    }


    createRipple(
        x,
        y
    );

}


/* =========================================
   MOUSE
========================================= */

loading.addEventListener(
    "pointerdown",
    waterTouch
);


/* =========================================
   TOUCH
========================================= */

loading.addEventListener(
    "touchstart",
    waterTouch,
    {
        passive:true
    }
);



/* ==================================================
   ONDA AUTOMÁTICA OCASIONAL
================================================== */

function automaticRipple(){


    if(
        loading.classList.contains(
            "hidden"
        )
    )
        return;


    /*
        Probabilidad de que aparezca
        una pequeña onda sola.
    */

    if(Math.random() < .65){

        createRipple(

            Math.random() *
            window.innerWidth,

            Math.random() *
            window.innerHeight

        );

    }


    setTimeout(
        automaticRipple,

        2500 +
        Math.random() * 4000
    );

}


setTimeout(
    automaticRipple,
    1800
);


</script>

</body>

</html>
